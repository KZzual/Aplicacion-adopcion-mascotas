<ion-header>
</ion-header>

<ion-content class="historial-page">
    <ion-header>
      <ion-toolbar>
        <ion-title>Historial de Posts</ion-title>
      </ion-toolbar>
    </ion-header>


  <ion-list lines="none">

      <ion-card class="post-card">
        <ion-card-header>
          <ion-card-title>Luciana de los montes</ion-card-title>
        </ion-card-header>
        <ion-card-content>
          <ion-item lines="none">
            <ion-icon name="hourglass-outline" color="warning" slot="start"></ion-icon>
            <ion-label>
              <h3>Aún en búsqueda</h3>
              <p>28/05/25 13:30</p>
            </ion-label>
          </ion-item>
        </ion-card-content>
      </ion-card>


      <ion-card class="post-card">
        <ion-card-header>
          <ion-card-title>Cholito</ion-card-title>
        </ion-card-header>
        <ion-card-content>
          <ion-item lines="none">
            <ion-icon name="thumbs-up-outline" color="success" slot="start"></ion-icon>
            <ion-label>
              <h3>En su nuevo hogar</h3>
              <p>27/05/25 10:30</p>
            </ion-label>
          </ion-item>
        </ion-card-content>
      </ion-card>

    </ion-list>

</ion-content>
