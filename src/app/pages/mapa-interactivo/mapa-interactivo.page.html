<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Mapa de Mascotas</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="centrarEnMiUbicacion()" (keyup.enter)="centrarEnMiUbicacion()" onKeyUp>
        <ion-icon name="navigate" slot="icon-only"></ion-icon>
      </ion-button>
      <ion-button id="filtros-trigger">
        <ion-icon name="options" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>

  <ion-toolbar>
    <ion-segment [(ngModel)]="especieFiltro" (ionChange)="onFiltroChange()">
      <ion-segment-button value="todos">
        <ion-label>Todos</ion-label>
      </ion-segment-button>
      <ion-segment-button value="perro">
        <ion-label>🐕 Perros</ion-label>
      </ion-segment-button>
      <ion-segment-button value="gato">
        <ion-label>🐱 Gatos</ion-label>
      </ion-segment-button>
    </ion-segment>
  </ion-toolbar>

  <ion-toolbar>
    <ion-segment [(ngModel)]="estadoFiltro" (ionChange)="onFiltroChange()">
      <ion-segment-button value="todos">
        <ion-label>Todos</ion-label>
      </ion-segment-button>
      <ion-segment-button value="disponible">
        <ion-label>Disponibles</ion-label>
      </ion-segment-button>
      <ion-segment-button value="adoptado">
        <ion-label>Adoptados</ion-label>
      </ion-segment-button>
    </ion-segment>
  </ion-toolbar>
</ion-header>

<!-- Popover de filtros avanzados -->
<ion-popover trigger="filtros-trigger" [dismissOnSelect]="false">
  <ng-template>
    <ion-content class="ion-padding">
      <h3>Filtros Avanzados</h3>

      <ion-list>
        <ion-item>
          <ion-checkbox [(ngModel)]="mostrarSoloConFoto" (ionChange)="onFiltroChange()">
            Solo con foto
          </ion-checkbox>
        </ion-item>

        <ion-item>
          <ion-checkbox [(ngModel)]="mostrarSoloCastrados" (ionChange)="onFiltroChange()">
            Solo castrados
          </ion-checkbox>
        </ion-item>

        <ion-item>
          <ion-checkbox [(ngModel)]="mostrarSoloVacunados" (ionChange)="onFiltroChange()">
            Solo vacunados
          </ion-checkbox>
        </ion-item>

        <ion-item>
          <ion-label>Radio máximo: {{ distanciaMaxKm }} km</ion-label>
        </ion-item>
        <ion-item>
          <ion-range
            [(ngModel)]="distanciaMaxKm"
            [min]="5"
            [max]="100"
            [step]="5"
            [pin]="true"
            (ionChange)="onFiltroChange()">
          </ion-range>
        </ion-item>
      </ion-list>
    </ion-content>
  </ng-template>
</ion-popover>

<ion-content>
  <!-- Indicador de carga -->
  <div class="loading-overlay" *ngIf="cargando">
    <ion-spinner name="crescent"></ion-spinner>
    <p>{{ mensajeCarga }}</p>
  </div>

  <div id="mapa-interactivo-container"></div>
</ion-content>
