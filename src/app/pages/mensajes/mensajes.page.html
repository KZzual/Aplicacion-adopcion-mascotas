<ion-header>

</ion-header>

<ion-content class="mensajes-content">
  <div class="mensajes-container">

    <!-- Lista de conversaciones -->
    <div class="conversations-list">
      <ion-card
        class="conversation-card"
        *ngFor="let conversation of conversations"
      >
        <ion-card-content>
          <div class="conversation-header">
            <button type="button" class="avatar-button" (click)="$event.stopPropagation(); openUserProfile(conversation)" aria-label="Ver perfil de {{ conversation.name }}">
              <ion-avatar>
                <img src="assets/img/logoapp1.1.png" alt="" [src]="conversation.avatar || 'assets/img/avatar3.png'" [attr.alt]="conversation.name" [attr.title]="conversation.name" (error)="onImageError($event)">
              </ion-avatar>
            </button>
            <button type="button" class="conversation-main" (click)="openConversation(conversation)" [attr.aria-label]="'Abrir conversación con ' + conversation.name">
              <span class="conversation-info">
                <span class="name-text">{{ conversation.name }}</span>
                <span class="last-message">{{ conversation.lastMessage }}</span>
              </span>
            </button>
            <div class="conversation-meta">
              <span class="time">{{ conversation.time }}</span>
              <ion-badge color="primary" *ngIf="conversation.unreadCount > 0">
                {{ conversation.unreadCount }}
              </ion-badge>
            </div>
          </div>
        </ion-card-content>
      </ion-card>
    </div>

    <!-- Estado vacío -->
    <div class="empty-state" *ngIf="conversations.length === 0">
      <ion-icon name="chatbubbles-outline" class="empty-icon"></ion-icon>
      <h2>No hay conversaciones</h2>
      <p>Cuando alguien te escriba sobre una adopción, aparecerá aquí.</p>
    </div>

  </div>
</ion-content>
